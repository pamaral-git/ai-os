# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 100
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/Models"
  "cloud": "/Users/pedroamaral/Documents"
  "image": "--image-min-tokens 1024"
  "config": "--context-shift --ui-config-file ${cloud}/AI-Files/AI-Brain/llama-settings.json"
  "agent": "--tools all --ui-mcp-proxy --mcp-servers-config ${cloud}/AI-Files/AI-Brain/mcp.json"
  "preset": "--jinja -ngl 99 --flash-attn on --reasoning-preserve -t 4 -tb 4 -b 2048 -ub 1024"
  "cache-q5": "--parallel 2 --cache-type-k q5_1 --cache-type-v q5_1"
  "cache-q8": "--parallel 1 --cache-type-k q8_0 --cache-type-v q5_1"

models:

  ling:
    name: "Ling A1B"
    aliases: ["Ling 8B A1B"]
    description: "8B MoE A1B Text Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 70500
    ttl: 1000
    unloadTimeout: 35

  minicpm:
    name: "MiniCPM5 2B"
    aliases: ["MiniCPM5 2B"]
    description: "2B Dense Text Model"
    capabilities:
      in: [text]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/miniCPM5-2B-heretic.gguf ${agent} 
      ${preset} -c 70500 ${cache-q5}
    ttl: 900
    unloadTimeout: 30

  qwen4b:
    name: "Qwen 4B"
    aliases: ["Qwen 4B"]
    description: "4B Dense Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache-q5} -c 70500
    ttl: 900
    unloadTimeout: 30

  qwen3a:
    name: "Qwen A3B"
    aliases: ["Qwen 35B A3B"]
    description: "35B MoE A3B Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 55800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.6-35B-A3B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.6-f16.gguf ${image}
      ${preset} -c 55800 ${cache-q5}
    unloadTimeout: 70

  qwen27b:
    name: "Qwen 27B Heretic"
    aliases: ["Qwen 3.8 Heretic"]
    description: "27B Dense Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 40800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0.1
        reasoning_budget: 13000
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-heretic-IQ3M.gguf
      --mmproj ${root}/.mmproj-qwen-3.8-27b.gguf ${image}
      ${preset} -c 40800 ${cache-q8} ${agent}
    unloadTimeout: 70

  qwen27gsq:
    name: "Qwen 3.8 GSQ"
    aliases: ["Qwen 3.8 GSQ"]
    description: "27B GSQ Dense Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 40800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 12000
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-GSQ-RCO.gguf ${agent}
      --mmproj ${root}/.mmproj-Qwen3.8-27B-BF16.gguf ${image}
      ${preset} -c 40800 ${cache-q8}
    ttl: 1000
    unloadTimeout: 70

matrix:
  vars:
    lng: ling
    cpm: minicpm
    q4b: qwen4b
    q3a: qwen3a
    q8h: qwen27b
    q8b: qwen27gsq

  sets:
    main: q3a
    agent: (cpm & q4b) | lng
    max: q8b | q8h
