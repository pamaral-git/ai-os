# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 100
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/models"
  "brain": "/Users/pedroamaral/Documents/AI-Brain"
  "image": "--image-min-tokens 1024"
  "config": "--cache-ram 4048 --ctx-checkpoints 16 --ui-config-file ${brain}/llama-conf.json"
  "agent": "--tools all --ui-mcp-proxy --mcp-servers-config ${brain}/.mcp.json"
  "preset": "--jinja -ngl 99  --flash-attn on --reasoning-preserve -t 4 -tb 4 -b 2048 -ub 1024"
  "1-slot": "--parallel 1"
  "2-slot": "--parallel 2 --kv-unified"
  "cache-q5": "--cache-type-k q5_1 --cache-type-v q5_1"
  "cache-q8": "--cache-type-k q8_0 --cache-type-v q5_1"

models:

  apple:
    name: "Apple Intelligence"
    description: "Apple Foundation Model"
    aliases: ["AFM"]
    useModelName: "system"
    cmd: /usr/bin/fm serve --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 0
    unloadTimeout: 35

  liquid:
    name: "LFM 2.5 MoE"
    aliases: ["LFM 24B A2B"]
    description: "A2B Text MoE Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 95000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM-2.5-24B-A2B-Q5-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 90000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  ling:
    name: "Ling A1B"
    aliases: ["Ling 8B A1B"]
    description: "8B MoE A1B Text Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 1000
    unloadTimeout: 35

  cpm1b:
    name: "MiniCPM5 4.7 1B"
    aliases: ["MiniCPM5 1B"]
    description: "1B Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      context: 95500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.15
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/minicpm-4.7-1b-heretic.gguf ${agent}
      --mmproj ${root}/.mmproj-minicpm-4.7-1b.gguf ${image}
      ${preset} -c 95500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.15
    ttl: 900
    unloadTimeout: 30

  cpm2b:
    name: "MiniCPM5 2B"
    aliases: ["MiniCPM5 2B"]
    description: "2B Dense Text Model"
    capabilities:
      in: [text]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.15
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/miniCPM5-2B-heretic.gguf ${agent} 
      ${preset} -c 70500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.15
    ttl: 900
    unloadTimeout: 30

  frog4b:
    name: "Frog Nano 4B"
    aliases: ["Frog 4B"]
    description: "Qwen-4B Microsoft Finetune"
    capabilities:
      in: [text, image]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/frognano-4b.gguf ${agent}
      --mmproj ${root}/.mmproj-frognano.gguf ${image}
      ${preset} ${cache-q5} -c 70500 ${2-slot} --min-p 0.05 --repeat-penalty 1.05
    ttl: 900
    unloadTimeout: 30

  qwen4b:
    name: "Qwen 4B"
    aliases: ["Qwen 4B"]
    description: "4B Dense Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 900
    unloadTimeout: 30

  qwen3a:
    name: "Qwen A3B"
    aliases: ["Qwen 35B A3B"]
    description: "35B MoE A3B Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 60800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.6-35B-A3B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.6-f16.gguf ${image}
      ${preset} -c 60800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  gemma2e:
    name: "Gemma E2B"
    description: "Gemma E2B LiteRT"
    useModelName: "gemma4-2b"
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/models
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 74500
    filters:
      setParams:
        temperature: 0.1
        audio_backend: cpu
        vision_backend: cpu
        max_num_tokens: 74500
        thinking: true
        thinking_budget: 12000
    cmd: /Users/pedroamaral/.local/bin/litert-lm serve --host 127.0.0.1 --port ${PORT}
    ttl: 1000
    unloadTimeout: 35

  gemma4a:
    name: "Gemma 25B MoE"
    aliases: ["Gemma 4 Heretic"]
    description: "Gemma 4 Heretic MoE"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 60800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/gemma-4-26B-A4B-it-heretic.Q4_K_S.gguf ${agent}
      --mmproj ${root}/.mmproj-gemma-4.gguf ${image}
      ${preset} -c 60800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  xspark:
    name: "Spark 2.6 4B"
    aliases: ["Spark"]
    description: "Spark 4B Dense"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 90800
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.90
        top_k: 40
        min_p: 0.05
        repeat_penalty: 1.0
        presence_penalty: 0.15
        reasoning_budget: 1536
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: "low"
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/spark-x2.6-4b.gguf ${agent}
      ${preset} -c 90800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  embgemma:
    name: "EmbeddingGemma 2"
    description: "Local text embeddings for Hindsight; 768 dimensions"
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT}
      -m "/Users/pedroamaral/Library/Application Support/DigUp/Models/embeddinggemma-2-Q8_0.gguf"
      --embedding --pooling mean -ngl 99 --flash-attn on
      -c 8192 -b 8192 -ub 8192 --parallel 1 -t 4 -tb 4 --no-webui
    ttl: 0
    unloadTimeout: 20

matrix:
  vars:
    fm3: apple
    l1a: ling
    c1b: cpm1b
    c2b: cpm2b
    f4b: frog4b
    q4b: qwen4b
    x4b: xspark
    e7k: embgemma
    l2a: liquid
    g2e: gemma2e
    g4a: gemma4a
    q3a: qwen3a

  sets:
    tiny: "(c1b | c2b | g2e) | (q4b | f4b | x4b) & e7k & fm3"
    moe: "(l1a | l2a | g4a | q3a) & e7k & fm3"
