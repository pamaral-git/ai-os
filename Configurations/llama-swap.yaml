# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 240
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/models"
  "cloud": "/Users/pedroamaral/Documents"
  "basic": "--tools all --ui-mcp-proxy --context-shift"
  "image": "--image-min-tokens 1024"
  "config": "--ui-config-file ${cloud}/AI-Files/AI-Brain/ui-config.json"
  "cache-max": "--cache-type-k q8_0 --cache-type-v q4_0"
  "cache-stb": "--cache-type-k q5_1 --cache-type-v q5_1"
  "cache-alt": "--cache-type-k q8_0 --cache-type-v q5_1"
  "agent": "${basic} --mcp-servers-config ${cloud}/AI-Files/AI-Brain/mcp.json"
  "preset": "--jinja -ngl 99 --flash-attn on --parallel 1 --reasoning-preserve -t 4 -tb 4 -b 2048 -ub 1024"

models:

  minicpm:
    name: "MiniCPM5 2B"
    aliases: ["MiniCPM5 2B"]
    description: "Tiny Dense Text model / 65k ctx, Cache v q5.1"
    capabilities:
      in: [text]
      out: [text]
      context: 65000
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/miniCPM5-2B-heretic.gguf ${agent} 
      ${preset} -c 65000 ${cache-alt}
    ttl: 900
    unloadTimeout: 30

  qwen-4b:
    name: "Qwen 3.5 4B"
    aliases: ["Qwen 4B"]
    description: "Tiny Dense Multimodal / 70k ctx, Cache v q5.1"
    capabilities:
      in: [text, image]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache-alt} -c 70500
    ttl: 900
    unloadTimeout: 30

  ling-9b:
    name: "Ling Tiny 9B"
    aliases: ["Ling Tiny 9B"]
    description: "Tiny MoE Text Model / 70k ctx, Cache q5.1"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny-heretic.gguf ${agent}
      ${preset} ${cache-alt} -c 70500 
    ttl: 1000
    unloadTimeout: 35

  laguna:
    name: "Laguna MoE"
    aliases: ["Laguna Agent"]
    description: "MoE Text model / 70k ctx, Cache v q5.1"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.70
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT}
      -m ${root}/laguna-XS-2.1-IQ3M.gguf ${config}
      ${preset} ${cache-stb} -c 70500 ${agent}
    unloadTimeout: 40

  ornith-9b:
    name: "Ornith 1.5 9B"
    aliases: ["Ornith 9b"]
    description: "Dense Multimodal Model / 70k ctx, Cache v q5.1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        reasoning_budget: 15000
        presence_penalty: 0.0
        repeat_penalty: 1.00
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-9B-heretic.gguf ${agent}
      --mmproj ${root}/.mmproj-ornith-1.5-9B.gguf ${image}
      ${preset} ${cache-alt} -c 70500 
    ttl: 1000
    unloadTimeout: 25

  ornith-a3b:
    name: "Ornith 1.5 A3B"
    aliases: ["Ornith A3B Agent"]
    description: "MoE Multimodal Model / 705k ctx, Cache v q5.1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 75800
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20400
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ornith-1.5-35B-A3B-Uncensored-IQ3M.gguf
      --mmproj ${root}/.mmproj-ornith-1.5-35B-A3B.gguf ${image}
      ${preset} ${cache-alt} -c 75800 ${agent}
    unloadTimeout: 60

  qwen-3.6:
    name: "Qwen 3.6"
    aliases: ["Qwen 3.6"]
    description: "MoE Multimodel Model / 70k ctx, Cache q5.1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.6-35B-A3B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.6-f16.gguf ${image}
      ${preset} -c 70800 ${cache-alt}
    unloadTimeout: 70

  qwen-3.8-swf:
    name: "Qwen 3.8 - Cache q5"
    aliases: ["Qwen 3.8 Swift"]
    description: "Multimodal Medium Reasoning / 60k ctx, Cache q5.1"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 60000
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 15000
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-swift-27B.gguf ${agent}
      ${preset} -c 60000 ${cache-stb}
    unloadTimeout: 70

  qwen-3.8-hrt:
    name: "Qwen 3.8 - Cache q4"
    aliases: ["Qwen 3.8 Medium"]
    description: "Multimodal Medium Reasoning / 70k ctx, Cache q4.0"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0.1
        reasoning_budget: 20000
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-heretic-IQ3M.gguf
      --mmproj ${root}/.mmproj-qwen-3.8-27b.gguf ${image}
      ${preset} -c 70800 ${cache-max} ${agent}
    unloadTimeout: 70

  qwen-3.8-gsq:
    name: "Qwen 3.8 GSQ"
    aliases: ["Qwen 3.8 GSQ"]
    description: "Quantisation GSQ-RCO / 70k ctx, Cache q5.1"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 70800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 20000
        chat_template_kwargs:
          reasoning_effort: medium
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.8-27B-GSQ-RCO.gguf ${agent}
      --mmproj ${root}/.mmproj-Qwen3.8-27B-BF16.gguf ${image}
      ${preset} -c 70800 ${cache-stb}
    ttl: 1000
    unloadTimeout: 70

matrix:
  vars:
    mpm: minicpm
    ltg: ling-9b
    lxs: laguna
    or3: ornith-a3b
    or9: ornith-9b
    q4b: qwen-4b
    qw6: qwen-3.6
    qsw: qwen-3.8-swf
    qht: qwen-3.8-hrt
    qgs: qwen-3.8-gsq

  sets:
    agent: (mpm | ltg | lxs | or9 | or3 | q4b | qw6 | qsw | qht | qgs)
