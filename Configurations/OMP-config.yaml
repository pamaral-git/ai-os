modelRoles:
  web: searxng
  tiny: llama.cpp/ling
  smol: llama.cpp/ling
  memory: llama.cpp/ling
  judge: llama.cpp/ling
  task: llama.cpp/minicpm
  default: llama.cpp/qwen3a:low
  vision: llama.cpp/qwen3a:high
  plan: llama.cpp/qwen27b:medium
  slow: llama.cpp/qwen27gsq:medium
  advisor: llama.cpp/qwen27gsq:medium
symbolPreset: nerd
composer:
  shape: box
  tokenRate: true
theme:
  dark: titanium
  light: light
setupVersion: 2
display:
  showTokenUsage: true
  pinnedAgents: full
  showTurnTime: true
