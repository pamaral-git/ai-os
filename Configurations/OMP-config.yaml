  format: auto
error:
  notify: "on"
compaction:
  enabled: true
  asyncEnabled: false
  midTurnEnabled: false
  methodOrder:
    - shake
    - soft
  thresholdPercent: 80
  handoffSaveToDisk: true
memory:
  backend: hindsight
autolearn:
  enabled: false
checkpoint:
  enabled: true
security:
  enabled: true
plan:
  enabled: true
  defaultOnStartup: false
  autosave: true
task:
