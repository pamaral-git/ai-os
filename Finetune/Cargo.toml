 [package]
 name = "sft-builder"
 version = "0.1.0"
 edition = "2021"

 [dependencies]
 anyhow     = "1"
 clap       = { version = "4", features = ["derive"] }
 csv        = "1"
 rand       = "0.8"
 serde      = { version = "1", features = ["derive"] }
 serde_json = { version = "1", features = ["preserve_order"] }
 walkdir    = "2"
 parquet    = { version = "55", optional = true, features = ["json"] }

 [features]
 default = ["parquet"]
