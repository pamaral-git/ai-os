# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 100
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/models"
  "brain": "/Users/pedroamaral/Documents/AI-Brain"
  "image": "--image-min-tokens 1024"
  "config": "--cache-ram 4048 --ctx-checkpoints 16 --ui-config-file ${brain}/llama-conf.json"
  "agent": "--tools all --ui-mcp-proxy --mcp-servers-config ${brain}/.mcp.json"
  "preset": "--jinja -ngl 99  --flash-attn on --reasoning-preserve -t 4 -tb 4 -b 2048 -ub 1024"
  "1-slot": "--parallel 1"
  "2-slot": "--parallel 2 --kv-unified"
  "cache-q5": "--cache-type-k q5_1 --cache-type-v q5_1"
  "cache-q8": "--cache-type-k q8_0 --cache-type-v q5_1"

models:

  apple:
    name: "Apple Intelligence"
    description: "Apple Foundation Model"
    aliases: ["AFM"]
    useModelName: "system"
    cmd: /usr/bin/fm serve --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 0
    unloadTimeout: 35

  lfmMoE:
    name: "LFM 2.5 MoE"
    aliases: ["LFM 24B A2B"]
    description: "A2B Text MoE Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 95000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM-2.5-24B-A2B-Q5-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 90000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  lfm1b:
    name: "LFM 3 1.7B"
    aliases: ["LFM 3 1.7B"]
    description: "1.7B Text Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 128000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        repeat_penalty: 1.1
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM3-1.7B.gguf ${agent}
      ${preset} ${cache-q5} -c 128000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  lfmomni:
    name: "LFM 3 Omni"
    aliases: ["LFM 3 2B Omni"]
    description: "2B Omni"
    capabilities:
      in: [text, audio, image, video]
      out: [text, audio, image, video]
      tools: true
      context: 105000
    filters:
      setParams:
        temperature: 0
        top_k: 50
        repeat_penalty: 1.05
        enable_thinking: false
        audio_temperature: 0.4
        audio_repetition_penalty: 1.2
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM3-Omni-2B.gguf ${agent} --reasoning off
      --mmproj ${root}/.mmproj-LFM3-Omni.gguf ${image}
      ${preset} ${cache-q5} -c 105000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  lfmaudio:
    name: "LFM 3 Audio"
    aliases: ["LFM 3 2B Audio"]
    description: "2B Audio"
    capabilities:
      in: [text, audio]
      out: [text, audio]
      tools: true
      context: 90000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM3-Audio-2B.gguf ${agent}
      --mmproj ${root}/.mmproj-LFM3-Audio.gguf
      ${preset} ${cache-q5} -c 90000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  lfmvl:
    name: "LFM 3 VL"
    aliases: ["LFM 3 2B VL"]
    description: "2B VL"
    capabilities:
      in: [text, image, video]
      out: [text]
      tools: true
      context: 128000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        top_p: 1.0
        min_p: 0.0
        repeat_penalty: 1.1
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/LFM3-vl-2B.gguf ${agent}
      --mmproj ${root}/.mmproj-LFM3-VL.gguf ${image}
      ${preset} ${cache-q5} -c 128000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  ling:
    name: "Ling A1B"
    aliases: ["Ling 8B A1B"]
    description: "8B MoE A1B Text Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 70500
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 1000
    unloadTimeout: 35

  cpmvl:
    name: "MiniCPM-VL 1B"
    aliases: ["MiniCPM VL"]
    description: "1B Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      context: 95500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.15
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/minicpm-vl-4.7-1b-heretic.gguf ${agent}
      --mmproj ${root}/.mmproj-minicpm-4.7-1b.gguf ${image}
      ${preset} -c 95500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.15
    ttl: 900
    unloadTimeout: 30

  cpm2b:
    name: "MiniCPM5 2B"
    aliases: ["MiniCPM5 2B"]
    description: "2B Dense Text Model"
    capabilities:
      in: [text]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.05
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/miniCPM5-2B-heretic.gguf ${agent} 
      ${preset} -c 70500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.05
    ttl: 900
    unloadTimeout: 30

  qwen4b:
    name: "Qwen 4B"
    aliases: ["Qwen 4B"]
    description: "4B Dense Multimodal"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 900
    unloadTimeout: 30

  qwen3a:
    name: "Qwen A3B"
    aliases: ["Qwen 35B A3B"]
    description: "35B MoE A3B Multimodal"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      tools: true
      context: 60800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.6-35B-A3B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.6-f16.gguf ${image}
      ${preset} -c 60800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  gemma2e:
    name: "Gemma E2B (LiteRT)"
    description: "Gemma E2B LiteRT"
    useModelName: "gemma4-2b-litert"
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /v1/models
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      tools: true
      context: 74500
    filters:
      setParams:
        temperature: 0.1
        audio_backend: cpu
        vision_backend: cpu
        max_num_tokens: 74500
        thinking: true
        thinking_budget: 12000
    cmd: /Users/pedroamaral/.local/bin/litert-lm serve --host 127.0.0.1 --port ${PORT}
    ttl: 1000
    unloadTimeout: 35

  gemma4a:
    name: "Gemma 25B MoE"
    aliases: ["Gemma 4 Heretic"]
    description: "Gemma 4 Heretic MoE"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      tools: true
      context: 60800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/gemma-4-26B-A4B-it-heretic.Q4_K_S.gguf ${agent}
      --mmproj ${root}/.mmproj-gemma-4.gguf ${image}
      ${preset} -c 60800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  xspark:
    name: "Spark 2.6 4B"
    aliases: ["Spark"]
    description: "Spark 4B Dense"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 90800
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.90
        top_k: 40
        min_p: 0.05
        repeat_penalty: 1.0
        presence_penalty: 0.15
        reasoning_budget: 1536
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: "low"
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/spark-x2.6-4b.gguf ${agent}
      ${preset} -c 90800 ${cache-q5} ${1-slot}
    unloadTimeout: 70

  embgemma:
    name: "EmbeddingGemma 2"
    description: "Local text embeddings for Hindsight; 768 dimensions"
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT}
      -m "/Users/pedroamaral/Library/Application Support/DigUp/Models/embeddinggemma-2-Q8_0.gguf"
      --embedding --pooling mean -ngl 99 --flash-attn on
      -c 8192 -b 8192 -ub 8192 --parallel 1 -t 4 -tb 4 --no-webui
    ttl: 0
    unloadTimeout: 20

matrix:
  vars:
    afm: apple
    l1a: ling
    c1b: cpmvl
    l1b: lfm1b
    l3o: lfmomni
    l3u: lfmaudio
    l3v: lfmvl
    l2a: lfmMoE
    c2b: cpm2b
    q4b: qwen4b
    x4b: xspark
    e7k: embgemma
    g2e: gemma2e
    g4a: gemma4a
    q3a: qwen3a

  sets:
    tiny: "(l1b | c2b) & (l3v | c1b | l3o | l3u) & e7k & afm"
    smol: "(q4b | x4b) & e7k & afm"
    moe: "(l1a | l2a | g4a | q3a) & afm"
