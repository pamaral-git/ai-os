# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 120
globalTTL: 1200
logLevel: info
logToStdout: proxy
captureBuffer: 0
startPort: 10001
sendLoadingState: true
includeAliasesInList: false

macros:
  "bin": "llama-server"
  "root": "/Users/pedroamaral/models"
  "brain": "/Users/pedroamaral/Documents/AI-Brain"
  "image": "--image-min-tokens 1024"
  "config": "--cache-ram 512 --ctx-checkpoints 4 --ui-config-file ${brain}/llama-conf.json"
  "agent": "--tools all --ui-mcp-proxy --mcp-servers-config ${brain}/.mcp.json"
  "preset": "--jinja -ngl 99 --flash-attn on --reasoning-preserve -t 4 -tb 4 -b 2048 -ub 1024"
  "1-slot": "--parallel 1"
  "2-slot": "--parallel 2 --kv-unified"
  "4-slot": "--parallel 4 --kv-unified"
  "cache-q4": "--cache-type-k q4_0 --cache-type-v q4_0"
  "cache-q5": "--cache-type-k q5_1 --cache-type-v q5_1"
  "cache-q8": "--cache-type-k q8_0 --cache-type-v q5_1"

models:

  apple:
    name: "Apple Intelligence"
    description: "Apple Foundation Model"
    aliases: ["AFM"]
    useModelName: "system"
    cmd: /usr/bin/fm serve --host 127.0.0.1 --port ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 0
    unloadTimeout: 35

  (ocr)cpm:
    name: "CPM OCR"  
    description: "MINI CPM DSpark"
    aliases: ["(OCR)CPM"]
    capabilities:
      in: [text, image]
      out: [text]
      tools: false
      context: 90000
    filters:
      setParams:
        temperature: 0.0
        top_k: 50
        repeat_penalty: 1.03
    cmd: | 
      ${bin} --host 127.0.0.1 --port ${PORT} --special
      -m ${root}/OCR/miniCPM-ocr.gguf --reasoning off
      --mmproj ${root}/OCR/.mmproj-miniCPM-ocr.gguf
      --model-draft ${root}/OCR/.dspark-miniCPM-ocr.gguf
      --spec-type draft-dspark --spec-draft-n-max 15
      ${preset} ${cache-q8} -c 90000 --parallel 3
    ttl: 1000
    unloadTimeout: 50

  (ocr)surya:
    name: "Surya OCR"  
    description: "Surya OCR"
    aliases: ["(OCR)Surya"]
    capabilities:
      in: [text, image]
      out: [text]
      tools: false
      context: 98304
    filters:
      setParams:
        temperature: 0.0
        top_k: 50
        repeat_penalty: 1.03
    cmd: | 
      ${bin} --host 127.0.0.1 --port ${PORT} --special
      -m ${root}/OCR/surya-ocr-2.5.gguf --reasoning off
      --mmproj ${root}/OCR/.mmproj-surya-ocr-2.5.gguf
       ${preset} ${cache-q8} -c 98304 --parallel 4 --kv-unified
    ttl: 1000
    unloadTimeout: 50

  lfmMoE:
    name: "LFM 2.5 MoE"
    aliases: ["LFM 24B A2B"]
    description: "A2B Text MoE Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 95000
    filters:
      setParams:
        temperature: 0.1
        top_k: 50
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/lfm-2.5-24b-a2b-Q5-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 90000 ${1-slot}
    ttl: 1000
    unloadTimeout: 35

  ling:
    name: "Ling A1B"
    aliases: ["Ling 8B A1B"]
    description: "8B MoE A1B Text Model"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 80500
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.95
        top_k: 20
        reasoning_budget: 20000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/ling-3-tiny-heretic.gguf ${agent}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 1000
    unloadTimeout: 35

  cpm1bvl:
    name: "MiniCPM-VL 1B"
    aliases: ["MiniCPM VL"]
    description: "1B Multimodal"
    capabilities:
      in: [text, image]
      out: [text]
      context: 95500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.15
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/minicpm-vl-4.7-1b-heretic.gguf ${agent}
      --mmproj ${root}/.mmproj-minicpm-4.7-1b.gguf ${image}
      ${preset} -c 95500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.15
    ttl: 900
    unloadTimeout: 30

  cpm2b:
    name: "MiniCPM5 2B"
    aliases: ["MiniCPM5 2B"]
    description: "2B Dense Text Model"
    capabilities:
      in: [text]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.60
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.05
        reasoning_budget: 15000
        enable_thinking: True
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/miniCPM5-2B-heretic.gguf ${agent} 
      ${preset} -c 70500 ${cache-q5} ${2-slot}
      --min-p 0.0 --repeat-penalty 1.05
    ttl: 900
    unloadTimeout: 30

  qwen4b:
    name: "Qwen 4B"
    aliases: ["Qwen 4B"]
    description: "4B Dense Multimodal"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      context: 70500
      tools: true
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        min_p: 0.05
        repeat_penalty: 1.05
        reasoning_budget: 15000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.5-4B-Uncensored-Q6K.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-4b.gguf ${image}
      ${preset} ${cache-q5} -c 70500 ${2-slot}
    ttl: 900
    unloadTimeout: 30

  qwen3a:
    name: "Qwen A3B"
    aliases: ["Qwen 35B A3B"]
    description: "35B MoE A3B Multimodal"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      tools: true
      context: 60800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/qwen-3.6-35B-A3B-heretic-IQ3M.gguf ${agent}
      --mmproj ${root}/.mmproj-qwen-3.6-f16.gguf ${image}
      ${preset} -c 60800 --cache-type-k q8_0 --cache-type-v q8_0 ${1-slot}
    unloadTimeout: 70

  gemma4e:
    name: "Gemma E4B"
    aliases: ["Gemma E4B"]
    description: "Gemma E4B "
    capabilities:
      in: [text, image, video]
      out: [text]
      tools: true
      context: 85800
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 64
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/gemma-4-E4B-it-heretic.gguf ${agent}
      --mmproj ${root}/.mmproj-gemma-4-e4b.gguf ${image}
      ${preset} -c 85800 --cache-type-k f16 --cache-type-v f16 ${1-slot}
    unloadTimeout: 70

  gemma4a:
    name: "Gemma A4B"
    aliases: ["Gemma 25B A4B"]
    description: "Gemma 4 25B A4B"
    capabilities:
      in: [text, image, audio, video]
      out: [text]
      tools: true
      context: 49152
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0
        reasoning_budget: 12000
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} --cache-ram 256
      --ctx-checkpoints 4 --ui-config-file ${brain}/llama-conf.json
      -m ${root}/gemma-4-26B-A4B-it-heretic.Q4_K_S.gguf ${agent}
      --mmproj ${root}/.mmproj-gemma-4.gguf ${image}
      ${preset} -c 49152 ${cache-q4} ${1-slot}
    unloadTimeout: 70

  nanbeige:
    name: "Nanbeige"
    aliases: ["Nanbeige"]
    description: "Nanbeige 3B Dense"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 124000
    filters:
      setParams:
        temperature: 0.6
        top_p: 0.90
        top_k: 40
        min_p: 0.05
        repeat_penalty: 1.0
        presence_penalty: 0.15
        reasoning_budget: 1536
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: "low"
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/nanbeige-4.2-3B-ARA-heresy.gguf ${agent}
      ${preset} -c 124000 ${cache-q5} ${4-slot}
    unloadTimeout: 70

  xspark:
    name: "Spark 2.6 4B"
    aliases: ["Spark"]
    description: "Spark 4B Dense"
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 90800
    filters:
      setParams:
        temperature: 0.7
        top_p: 0.90
        top_k: 40
        min_p: 0.05
        repeat_penalty: 1.0
        presence_penalty: 0.15
        reasoning_budget: 1536
        chat_template_kwargs:
          enable_thinking: true
          reasoning_effort: "low"
    cmd: |  
      ${bin} --host 127.0.0.1 --port ${PORT} ${config}
      -m ${root}/spark-X2.6-4b-heretic.gguf ${agent}
      ${preset} -c 90800 --cache-type-k q8_0 --cache-type-v q8_0 ${4-slot}
    unloadTimeout: 70

  embgemma:
    name: "EmbeddingGemma 2"
    description: "Local text embeddings 768 dimensions"
    cmd: |
      ${bin} --host 127.0.0.1 --port ${PORT}
      -m "/Users/pedroamaral/Library/Application Support/DigUp/Models/embeddinggemma-2-Q8_0.gguf"
      --embedding --pooling mean -ngl 99 --flash-attn on
      -c 8192 -b 8192 -ub 8192 --parallel 1 -t 4 -tb 4 --no-webui
    ttl: 0
    unloadTimeout: 20

matrix:
  vars:
    l1a: ling
    l2a: lfmMoE
    g4e: gemma4e
    g4a: gemma4a
    q3a: qwen3a
    afm: apple
    emb: embgemma
    c1b: cpm1bvl
    c2b: cpm2b
    q4b: qwen4b
    x4b: xspark
    n3b: nanbeige

  sets:
    tiny: "(n3b | c2b) & (c1b) & emb & afm"
    smol: "(q4b | x4b | n3b) & emb & afm"
    moe: "(l1a | l2a | g4a | q3a | g4e)"
