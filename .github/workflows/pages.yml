name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build HTML Site
        shell: bash
        run: |
          mkdir -p _site
          touch _site/.nojekyll

          # Copy root index.html as the primary landing page
          if [ -f "index.html" ]; then
            cp index.html _site/
          elif [ -f "Index.html" ]; then
            cp Index.html _site/index.html
          fi

          # Copy directory hierarchy with all .html/.htm files into _site
          find . -type f \( -name '*.html' -o -name '*.htm' \) ! -path './.*' ! -path './_site/*' ! -path './index.html' ! -path './Index.html' | while IFS= read -r file; do
            dest="_site/${file#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done

          # Copy companion web assets (images, css, js, json, svg, webp)
          find . -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' -o -name '*.webp' -o -name '*.gif' -o -name '*.css' -o -name '*.js' -o -name '*.json' \) ! -path './.*' ! -path './_site/*' | while IFS= read -r file; do
            dest="_site/${file#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
