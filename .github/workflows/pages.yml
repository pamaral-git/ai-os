name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build HTML Site
        shell: bash
        run: |
          set -e
          mkdir -p _site
          touch _site/.nojekyll

          # Copy root index file (create default if missing)
          if [ -f "index.html" ]; then
            cp index.html _site/
          elif [ -f "Index.html" ]; then
            cp Index.html _site/index.html
          else
            echo "<!DOCTYPE html><html><head><meta http-equiv=\"refresh\" content=\"0; url=Docs/index.html\"></head></html>" > _site/index.html
          fi

          # Copy ALL .html/.htm files preserving directory structure
          find . -type f \( -name '*.html' -o -name '*.htm' \) \
            ! -path './.*' \
            ! -path './_site/*' \
            -exec cp --parents {} _site/ \;

          # Copy ALL web assets preserving directory structure
          find . -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' \
            -o -name '*.webp' -o -name '*.gif' -o -name '*.css' -o -name '*.js' \
            -o -name '*.json' -o -name '*.woff' -o -name '*.woff2' -o -name '*.ttf' \
            -o -name '*.otf' \) \
            ! -path './.*' \
            ! -path './_site/*' \
            -exec cp --parents {} _site/ \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
