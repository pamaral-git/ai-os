      code: '{"prompt": "Solve: integrate x*cos(x) dx.",\n "prefix": "Let me think. By parts: u=x, dv=cos(x)dx. Then v=sin(x). The next step is",\n "loop_token": "Wait",\n "loop_token_id": 1420,\n "alternative_tokens": ["to", "int", "x*sin", "evaluating", "applying"],\n "alternative_token_ids": [284, 1892, 4210, 8912, 5104],\n "meta": {"intervention": "antidoom_ftpo", "period": 36, "repeats": 6}}'
    },
    {
      id: "dpo",
      title: "DPO (Epistemic preference)",
      note: "Field names move between trainers. Keep meta for held-out topic analysis; strip if loader objects.",
      code: '{"prompt": "Did Socrates write the Apology?",\n "chosen": "No. Plato composed the dialogue we call the Apology. Xenophon wrote a different one, and they do not match. How closely Plato tracks the historical speech is disputed. I would call Plato\'s version a literary defense, not a transcript, and I would not pretend the distance is known.",\n "rejected": "No. The Apology is not a transcript, and it is unwise to be sure. Plato wrote something, Xenophon wrote something else, and reasonable people disagree about all of it, so the careful answer is that we cannot really say who wrote what or how close any of it is.",\n "meta": {"axis": "A-and-B", "topic": "ancient-phil"}}'
    },
    {
      id: "grpo",
      title: "GRPO (Verifiable prompts)",
      note: "Gold fields are for your python reward function, not for teacher supervision.",
      code: '{"prompt": "Extract \'Ana, 34, Porto\' as JSON with keys name, age, city.",\n "verifier": "json_keys",\n "spec": {"keys": ["name", "age", "city"], "types": {"age": "int"}}}\n{"prompt": "Who painted Las Meninas? Reply with Answer and Confidence from 0 to 1.",\n "gold": "Velazquez",\n "answerable": true}\n{"prompt": "What did Socrates publish in 399 BCE? Reply with Answer and Confidence, or abstain.",\n "answerable": false}'
    },
    {
      id: "distill",
      title: "Distillation (Stored traces)",
      note: "Generate these where the frontier teacher fits. Train locally with LoRA SFT or DPO.",
      code: '{"messages": [\n  {"role": "user", "content": "Is the is-ought gap a fallacy or a warning?"},\n  {"role": "assistant", "content": "<think>Separate the narrow entailment claim from the wide claim that facts cannot bear on morals.</think> The narrow claim is a warning about smuggled premises. The wide claim does not follow."}\n]}'
    }
  ];


  const FTPO_TRAINER_CODE = `import torch
import torch.nn.functional as F
from trl import DPOTrainer

class FTPOTrainer(DPOTrainer):
    \"\"\"
    Surgical Antidoom Trainer: overrides compute_loss to train only
    the single bifurcation token with an MSE raw-logit stability penalty.
    \"\"\"
    def compute_loss(self, model, inputs, return_outputs=False):
        # 1. Forward pass on model & frozen reference
        outputs = model(inputs[\"input_ids\"])
        with torch.no_grad():
            ref_outputs = self.ref_model(inputs[\"input_ids\"])
            
        logits = outputs.logits[:, -1, :]      # (B, V) at bifurcation pos
        ref_logits = ref_outputs.logits[:, -1, :]
        
        loop_id = inputs[\"loop_token_id\"]       # target bad token
        alt_ids = inputs[\"alt_token_ids\"]       # list of ~20 candidate tokens
        
        # 2. Preference gap: push probability from loop token to alternatives
        p_loop = logits.gather(-1, loop_id.unsqueeze(-1))
        p_alts = logits.gather(-1, alt_ids).logsumexp(dim=-1, keepdim=True)
        gap = p_alts - p_loop
        
        # 3. DPO soft margin loss
        loss_ftpo = -F.logsigmoid(self.beta * gap).mean()
        
        # 4. Raw-logit MSE stability penalty (prevents drift on all other tokens)
        loss_stab = F.mse_loss(logits, ref_logits)
        
        total_loss = loss_ftpo + 0.1 * loss_stab
        return (total_loss, outputs) if return_outputs else total_loss`;

  const MPOA_CODE = `import mlx.core as mx

def ablate_layer_mpoa(W: mx.array, v: mx.array, alpha: float = 1.0) -> mx.array:
    \"\"\"
    Magnitude-Preserving Orthogonal Ablation (MPOA / Heretic) in pure MLX.
    W: Weight matrix (out_features, in_features)
    v: Normalized feature direction in residual space (in_features,)
    alpha: Ablation strength (1.0 = full orthogonal projection)
    \"\"\"
    v_norm = v / mx.linalg.norm(v)
    
    # 1. Project W onto orthogonal complement: W_perp = W - alpha * (W @ v) outer v
    proj = mx.outer(W @ v_norm, v_norm)
    W_perp = W - alpha * proj
    
    # 2. Row-wise magnitude preservation (prevents activation collapse)
    orig_row_norms = mx.linalg.norm(W, axis=1, keepdims=True)
    perp_row_norms = mx.linalg.norm(W_perp, axis=1, keepdims=True) + 1e-8
    W_mpoa = W_perp * (orig_row_norms / perp_row_norms)
    
    return W_mpoa`;

  const PYTHON_REWARD = 'import json\n\ndef reward(out, spec):\n    score = 0.0\n    try:\n        obj = json.loads(out)\n        score += 0.3\n        keys = spec["keys"]\n        score += 0.4 * all(k in obj for k in keys)\n        score += 0.3 * all(\n            isinstance(obj.get(k), int)\n            for k, t in spec["types"].items()\n            if t == "int"\n        )\n    except Exception:\n        pass\n    return score';

  const MLX_COMMAND = '# SFT or CPT with stock MLX-LM\nmlx_lm.lora \\\n  --model <path-or-repo> \\\n  --train \\\n  --data <folder> \\\n  --batch-size 2 \\\n  --num-layers 16 \\\n  --iters <steps from memory instrument> \\\n  --fine-tune-type lora\n\n# A 4-bit base model path makes this QLoRA.\n# Full CPT on 450M: --fine-tune-type full\n\n# DPO and GRPO live in mlx-lm-lora:\n#   mlx_lm_lora.train --help';

  return '<article>' +

    '<div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1.5rem;">' +
      SCHEMAS.map(s =>
        '<div class="panel" style="margin-top: 0;">' +
          '<div style="display: flex; justify-content: space-between; align-items: baseline;">' +
            '<h3 class="section-h3" style="margin-top: 0;">' + s.title + '</h3>' +
            '<button type="button" class="btn-secondary" onclick="copyText(decodeURIComponent(\'' + encodeURIComponent(s.code) + '\'))">Copy</button>' +

          '<p style="font-size: 0.85rem; color: var(--color-secondary); margin: 0.4rem 0 0.75rem;">' + s.note + '</p>' +
          '<pre class="code-block">' + s.code + '</pre>' +
        '</div>'
      ).join("") +
      '<div class="panel" style="margin-top: 0;">' +
        '<div style="display: flex; justify-content: space-between; align-items: baseline;">' +
          '<h3 class="section-h3" style="margin-top: 0;">Python JSON Verifier with Partial Credit</h3>' +
          '<button type="button" class="btn-secondary" onclick="copyText(decodeURIComponent(\'' + encodeURIComponent(PYTHON_REWARD) + '\'))">Copy</button>' +
        '</div>' +
        '<pre class="code-block" style="margin-top: 0.75rem;">' + PYTHON_REWARD + '</pre>' +
      '</div>' +
      '<div class="panel" style="margin-top: 0;">' +
        '<div style="display: flex; justify-content: space-between; align-items: baseline;">' +
          '<h3 class="section-h3" style="margin-top: 0;">MLX Training Shell Invocation</h3>' +

      '</div>' +
    '</div>' +
  '</article>';
}

function generateNotesMarkdown() {
  const lines = ["# Notes: Post-Training on Apple Silicon", "", "Exported: " + new Date().toISOString(), ""];
  lines.push("## Skill Assessment");
  for (const s of SKILLS) {
    lines.push("- " + s.label + ": " + (state.skills[s.id] || 0) + " / 5");
  }
  lines.push("", "## Socratic Predictions & Exam Answers");
  for (const [id, prompt] of Object.entries(PROMPTS)) {
    const ans = (id.startsWith("exam-") ? state.exam[id] : state.predicts[id]) || "";
    if (ans.trim()) {
      lines.push("\n### " + prompt + "\n\n" + ans.trim());
    }
  }
  lines.push("", "## Memory Configuration Last Used", "```json", JSON.stringify(state.calc, null, 2), "```");
  return lines.join("\n");
}

// --- State Mutation & Dispatchers ---
let currentSection = "desk";

function navigateTo(secId) {
  currentSection = secId;
  window.location.hash = secId;
  document.querySelectorAll(".nav-btn, .mobile-nav-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-sec") === secId);
  });
  renderCurrentSection();
  window.scrollTo(0, 0);
}

function renderCurrentSection() {
  const container = document.getElementById("content-container");
  switch (currentSection) {
    case "desk": container.innerHTML = renderDesk(); break;
    case "memory": container.innerHTML = renderMemory(); break;
    case "paradigms": container.innerHTML = renderParadigms(); break;
    case "drift": container.innerHTML = renderDrift(); break;
    case "dpo": container.innerHTML = renderDpo(); break;
    case "grpo": container.innerHTML = renderGrpo(); break;
    case "surgery": container.innerHTML = renderSurgery(); break;
    case "schemas": container.innerHTML = renderSchemas(); break;
    case "roadmap": container.innerHTML = renderRoadmap(); break;
    default: container.innerHTML = renderDesk(); break;
  }
}

function updateCalc(patch) {
  state.calc = Object.assign({}, state.calc, patch);
  saveData();
  renderCurrentSection();
}

function applyPreset(presetKey) {
  if (PRESETS[presetKey]) {
    state.calc = Object.assign({}, state.calc, PRESETS[presetKey]);
    saveData();
    showToast("Applied preset " + PRESETS[presetKey].name);
    renderCurrentSection();
  }
}

function updatePredictText(bucket, id, val) {
  if (bucket === "exam") state.exam[id] = val;
  else state.predicts[id] = val;
  saveData();
  const statusEl = document.getElementById("predict-status-" + id);
  const isOpened = Boolean(state.opened[id]);
  const btn = document.querySelector("#predict-" + id + " button");
  if (statusEl && !isOpened) {
    const len = val.trim().length;
    statusEl.textContent = Math.min(len, 24) + " / 24 characters before the claim opens.";
    if (btn) btn.disabled = len < 24;
  }
}

function uncoverPredict(id) {
  state.opened[id] = true;
  saveData();
  renderCurrentSection();
}

function toggleExamCheck(id, index) {
  const list = state.checks[id] || [];
  const next = list.includes(index) ? list.filter(i => i !== index) : list.concat([index]);
  state.checks[id] = next;
  saveData();
  renderCurrentSection();
}

function updateSkill(id, val) {
  state.skills[id] = val;
  saveData();
  renderCurrentSection();
}

function selectGoal(gId) {
  state.selectedGoal = gId;
  renderCurrentSection();
}

function updateLambda(val) {
  state.lambda = val;
  renderCurrentSection();
}

function updateDpoGap(g) {
  state.dpoGap = g;

}

function updateDpoBeta(b) {
  state.dpoBeta = b;

  state.dpoTrap = !state.dpoTrap;

function loadDoomPreset(type) {
  if (type === "loop") {
    state.doomText = "Let me think step by step. Consider the base case. Wait, let me reconsider this approach. Wait, let me reconsider this approach. Wait, let me reconsider this approach. Wait, let me reconsider this approach.";
  } else {
    state.doomText = "Let me think step by step. Consider the base case. The derivative of x*cos(x) is cos(x) - x*sin(x). Applying integration by parts gives x*sin(x) + cos(x) + C. The proof closes cleanly.";

  saveData();
  renderCurrentSection();
}

function copyText(str) {
  navigator.clipboard.writeText(str).then(() => {
    showToast("Copied to clipboard!");
  }).catch(() => {

  });
}

// --- Init ---
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".nav-btn, .mobile-nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const sec = btn.getAttribute("data-sec");
      if (sec) navigateTo(sec);
    });
  });

  const hash = window.location.hash.replace("#", "");
  if (["desk", "memory", "paradigms", "drift", "dpo", "grpo", "surgery", "schemas", "roadmap"].includes(hash)) {
    navigateTo(hash);
  } else {
    navigateTo("desk");
  }

  window.addEventListener("hashchange", () => {
    const h = window.location.hash.replace("#", "");
    if (h && h !== currentSection) {
      navigateTo(h);
    }
  });
});
