<script>
'use strict';
const T = window.AgentTools;

async function articSearch(query, n) {
  const fields = 'id,title,artist_title,date_display,image_id,medium_display,place_of_origin';
  const url = 'https://api.artic.edu/api/v1/artworks/search?q=' +
    encodeURIComponent(query) + '&limit=' + n + '&fields=' + fields;
  const j = await T.fetchJson(url);
  const iiif = (j.config && j.config.iiif_url) || 'https://www.artic.edu/iiif/2';
  return (j.data || []).map(function (a) {
    return {
      source: 'artic',
      id: a.id,
      title: a.title,
      artist: a.artist_title || null,
      date: a.date_display || null,
      medium: a.medium_display ? T.cap(a.medium_display, 80) : null,
      image: a.image_id ? iiif + '/' + a.image_id + '/full/843,/0/default.jpg' : null,
    };
  });
}

async function articWork(id) {
  const fields = 'id,title,artist_title,date_display,medium_display,place_of_origin,image_id';
  const j = await T.fetchJson('https://api.artic.edu/api/v1/artworks/' + id + '?fields=' + fields);
  const d = j.data || {};
  const iiif = (j.config && j.config.iiif_url) || 'https://www.artic.edu/iiif/2';
  return {
    source: 'artic',
    id: d.id,
    title: d.title,
    artist: d.artist_title || null,
    date: d.date_display || null,
    place: d.place_of_origin || null,
    medium: d.medium_display ? T.cap(d.medium_display, 120) : null,
    image: d.image_id ? iiif + '/' + d.image_id + '/full/843,/0/default.jpg' : null,
  };
}

/* Met search v1 is 410 Gone. v1.1 search + v1 object is the live split. */
async function metSearch(query, n) {
  const j = await T.fetchJson(
    'https://collectionapi.metmuseum.org/public/collection/v1.1/search?q=' +
    encodeURIComponent(query) + '&hasImages=true'
  );
  const ids = (j.objectIDs || []).slice(0, n);
  const objs = await Promise.all(ids.map(function (id) {
    return T.fetchJson('https://collectionapi.metmuseum.org/public/collection/v1/objects/' + id).catch(function () { return null; });
  }));
  return objs.filter(Boolean).map(function (o) {
    return {
      source: 'met',
      id: o.objectID,
      title: o.title,
      artist: o.artistDisplayName || null,
      date: o.objectDate || null,
      medium: o.medium ? T.cap(o.medium, 80) : null,
      image: o.primaryImageSmall || o.primaryImage || null,
    };
  });
}

async function metWork(id) {
  const o = await T.fetchJson('https://collectionapi.metmuseum.org/public/collection/v1/objects/' + id);
  return {
    source: 'met',
    id: o.objectID,
    title: o.title,
    artist: o.artistDisplayName || null,
    date: o.objectDate || null,
    medium: o.medium ? T.cap(o.medium, 120) : null,
    image: o.primaryImageSmall || o.primaryImage || null,
  };
}

/* PoetryDB: `/poems`, `.json`, and `?fields=` return {"status":"405"} in a 200 body. */
function poetryGuard(raw) {
  const s = String(raw);
  if (s.indexOf('"status":"405"') > -1 || s.indexOf('"status": "405"') > -1) {
    throw new Error('PoetryDB 405: output field rejected. Bare paths only (/title/X, /author/Y, /random/N).');
  }
  let j;
  try { j = JSON.parse(s); } catch (e) { throw new Error('PoetryDB returned non-JSON.'); }
  if (!Array.isArray(j)) throw new Error('PoetryDB returned unexpected shape.');
  return j;
}

async function poem(opts) {
  const by = opts.by || 'title';
  let url;
  if (by === 'random') {
    const n = T.clampInt(opts.n, 1, 5, 1);
    url = 'https://poetrydb.org/random/' + n;
  } else if (by === 'author') {
    if (!opts.q) throw new Error('by=author needs q (author name).');
    url = 'https://poetrydb.org/author/' + encodeURIComponent(opts.q);
  } else {
    if (!opts.q) throw new Error('by=title needs q (title).');
    url = 'https://poetrydb.org/title/' + encodeURIComponent(opts.q);
  }
  const raw = await T.fetchText(url);
  const arr = poetryGuard(raw).slice(0, 3);
  return arr.map(function (p) {
    const lines = p.lines || [];
    return {
      source: 'poetrydb',
      title: p.title,
      author: p.author,
      linecount: p.linecount || lines.length,
      lines: lines.slice(0, 20),
      truncated: lines.length > 20,
    };
  });
}

/* Tumblr RSS feed parser for havingapoemwithyou.tumblr.com */
function parseRssFeed(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const items = doc.querySelectorAll('item');
  const out = [];
  items.forEach(function (item) {
    const title = item.querySelector('title');
    const description = item.querySelector('description');
    const link = item.querySelector('link');
    const categories = item.querySelectorAll('category');
    let author = null;
    categories.forEach(function (cat) {
      const text = cat.textContent.trim();
      if (text && !text.match(/poetry|poem|^$/i) && !text.match(/^\d+$/)) {
        if (!author) author = text;
      }
    });
    if (title) {
      let poemTitle = title.textContent.trim();
      const authorMatch = poemTitle.match(/^(.+?)\s+by\s+(.+)$/i);
      if (authorMatch) {
        poemTitle = authorMatch[1].trim();
        author = authorMatch[2].trim();
      }
      let content = '';
      if (description) {
        content = description.textContent;
        content = content.replace(/<[^>]+>/g, ' ');
        content = content.replace(/\s+/g, ' ').trim();
      }
      out.push({
        source: 'tumblr',
        title: poemTitle,
        author: author,
        content: content,
        url: link ? link.textContent : null,
      });
    }
  });
  return out;
}

async function tumblrPoems(opts) {
  const n = T.clampInt(opts.n, 1, 10, 3);
  const url = 'https://havingapoemwithyou.tumblr.com/rss';
  const xml = await T.fetchText(url, { timeoutMs: 30000 });
  const items = parseRssFeed(xml);
  if (opts.by === 'random') {
    const shuffled = items.sort(function () { return Math.random() - 0.5; });
    return shuffled.slice(0, n).map(function (item, idx) {
      return {
        source: 'tumblr',
        title: item.title,
        author: item.author,
        content: item.content,
        url: item.url,
        index: idx + 1,
      };
    });
  } else if (opts.by === 'author' && opts.q) {
    const q = opts.q.toLowerCase();
    return items.filter(function (item) {
      return item.author && item.author.toLowerCase().includes(q);
    }).slice(0, n).map(function (item, idx) {
      return {
        source: 'tumblr',
        title: item.title,
        author: item.author,
        content: item.content,
        url: item.url,
        index: idx + 1,
      };
    });
  } else if (opts.by === 'title' && opts.q) {
    const q = opts.q.toLowerCase();
    return items.filter(function (item) {
      return item.title && item.title.toLowerCase().includes(q);
    }).slice(0, n).map(function (item, idx) {
      return {
        source: 'tumblr',
        title: item.title,
        author: item.author,
        content: item.content,
        url: item.url,
        index: idx + 1,
      };
    });
  }
  return items.slice(0, n).map(function (item, idx) {
    return {
      source: 'tumblr',
      title: item.title,
      author: item.author,
      content: item.content,
      url: item.url,
      index: idx + 1,
    };
  });
}

/* Poetry Foundation scraper */
async function poetryFoundationSearch(opts) {
  const n = T.clampInt(opts.n, 1, 10, 3);
  const query = opts.q ? encodeURIComponent(opts.q) : '';
  const by = opts.by || 'title';
  let url;
  if (by === 'random') {
    url = 'https://www.poetryfoundation.org/poems/browse#page=1&sort_by=random';
  } else if (by === 'author') {
    url = 'https://www.poetryfoundation.org/poets/' + query;
  } else {
    url = 'https://www.poetryfoundation.org/poems/search?query=' + query;
  }
  const html = await T.fetchText(url, { timeoutMs: 30000 });
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  if (by === 'random') {
    doc.querySelectorAll('.c-featurePoem, .c-poem').forEach(function (el, idx) {
      if (idx >= n) return;
      const titleEl = el.querySelector('.c-featurePoem__title, h2, h1, .c-poem__title');
      const authorEl = el.querySelector('.c-featurePoem__author, .c-poem__author, .c-byline');
      const linesEl = el.querySelector('.c-featurePoem__text, .c-poem__text, .o-poem');
      if (titleEl) {
        out.push({
          source: 'poetryfoundation',
          title: titleEl.textContent.trim(),
          author: authorEl ? authorEl.textContent.trim() : null,
          content: linesEl ? linesEl.textContent.replace(/\s+/g, ' ').trim() : null,
        });
      }
    });
  } else {
    doc.querySelectorAll('.c-resultItem, .c-poemResult, [itemprop="poem"]').forEach(function (el, idx) {
      if (idx >= n) return;
      const titleEl = el.querySelector('[itemprop="name"], .c-resultItem__title, h3, h2');
      const authorEl = el.querySelector('[itemprop="author"], .c-resultItem__author, .c-byline');
      if (titleEl) {
        out.push({
          source: 'poetryfoundation',
          title: titleEl.textContent.trim(),
          author: authorEl ? authorEl.textContent.trim() : null,
          content: null,
        });
      }
    });
  }
  return out.slice(0, n);
}

/* Lyrikline scraper */
async function lyriklineSearch(opts) {
  const n = T.clampInt(opts.n, 1, 10, 3);
  const query = opts.q ? encodeURIComponent(opts.q) : '';
  const by = opts.by || 'title';
  let url;
  if (by === 'random') {
    url = 'https://www.lyrikline.org/en/poems/random';

  } else {

  const html = await T.fetchText(url, { timeoutMs: 30000 });

      if (idx >= n) return;
      const titleEl = el.querySelector('h3, h2, .title, a');

      if (titleEl) {
        out.push({
          source: 'lyrikline',

}

/* Poetry in Translation scraper */
async function poetryInTranslationSearch(opts) {
  const n = T.clampInt(opts.n, 1, 10, 3);
  const query = opts.q ? encodeURIComponent(opts.q) : '';
  const by = opts.by || 'title';
  let url;
  if (by === 'random') {
    url = 'https://www.poetryintranslation.com/';
  } else if (by === 'author') {
    url = 'https://www.poetryintranslation.com/poets/' + query;
  } else {
    url = 'https://www.poetryintranslation.com/?s=' + query;
  }
  const html = await T.fetchText(url, { timeoutMs: 30000 });
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  if (by === 'random') {
    doc.querySelectorAll('.poem, .poem-content, .entry-content').forEach(function (el, idx) {
      if (idx >= n) return;
      const titleEl = el.querySelector('h2, h1, .entry-title');
      const authorEl = el.querySelector('.author, .byline, .poet-name');
      const textEl = el.querySelector('.poem-text, .poem-body, .entry-content p');
      if (titleEl) {
        let content = null;
        if (textEl) {
          const paragraphs = textEl.querySelectorAll('p');
          if (paragraphs.length > 0) {
            content = Array.from(paragraphs).map(p => p.textContent.trim()).join('\n').replace(/\s+/g, ' ').trim();
          } else {
            content = textEl.textContent.replace(/\s+/g, ' ').trim();
          }
        }
        out.push({
          source: 'poetryintranslation',
          title: titleEl.textContent.trim(),
          author: authorEl ? authorEl.textContent.trim() : null,
          content: content,
        });
      }
    });
  } else {
    doc.querySelectorAll('.search-result, .poem-list-item, article, .poem-summary').forEach(function (el, idx) {
      if (idx >= n) return;
      const titleEl = el.querySelector('h3, h2, a, .title, .entry-title');
      const authorEl = el.querySelector('.author, .byline, .poet-name');
      if (titleEl) {
        out.push({
          source: 'poetryintranslation',
          title: titleEl.textContent.trim(),
          author: authorEl ? authorEl.textContent.trim() : null,
          content: null,
        });
      }
    });
  }
  return out.slice(0, n);
}

async function gutenbergSearch(query) {
  const html = await T.fetchText(
    'https://www.gutenberg.org/ebooks/search/?query=' + encodeURIComponent(query)
  );
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  doc.querySelectorAll('li.booklink').forEach(function (li) {
    const a = li.querySelector('a.link');
    const title = li.querySelector('span.title');
    const sub = li.querySelector('span.subtitle');
    const href = (a && a.getAttribute('href')) || '';
    const m = href.match(/\/ebooks\/(\d+)/);
    if (m && title) {
      out.push({
        id: parseInt(m[1], 10),
        title: title.textContent.trim(),
        author: sub ? sub.textContent.trim() : null,
      });
    }
  });
  return out.slice(0, 8);
}

function stripGutenbergLicense(raw) {
  const START_RE = /\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG EBOOK[^\n]*\n/i;
  const END_RE = /\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG EBOOK/i;
  let t = raw;
  const s = t.search(START_RE);
  if (s > -1) {
    const nl = t.indexOf('\n', s);
    t = nl > -1 ? t.slice(nl + 1) : t.slice(s);
  }
  const e = t.search(END_RE);
  if (e > -1) t = t.slice(0, e);
  return t.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function gutenbergIngest(id) {
  const raw = await T.fetchText('https://www.gutenberg.org/cache/epub/' + id + '/pg' + id + '.txt', {
    timeoutMs: 25000,
    retries: 0,
  });
  if (raw.length > 1200000) {
    throw new Error('text too large (>1.2 MB) — pick a shorter work.');
  }
  const text = stripGutenbergLicense(raw);
  const chunks = T.chunkSentences(text, 500);
  if (!chunks.length) throw new Error('no usable text after license stripping');
  const key = 'rag:culture:pg' + id;
  T.kv.set(key, {
    source: 'pg' + id,
    url: 'https://www.gutenberg.org/ebooks/' + id,
    chunks: chunks.slice(0, 400),
    ingested: new Date().toISOString(),
  });
  return {
    id: id,
    chunks: chunks.length,
    stored: Math.min(chunks.length, 400),
    preview: T.cap(chunks[0], 200),
    kv_key: 'agt:' + key,
  };
}

async function dispatch(data) {
  const action = data && data.action;
  try {
    if (action === 'search') {
      const src = data.source === 'met' ? 'met' : 'artic';
      const n = T.clampInt(data.n, 1, 8, 5);
      const query = String(data.query || '').trim();
      if (!query) return T.err('search needs query', 'Ask what to search for (e.g. "van gogh", "monet").');
      try {
        const rows = src === 'met' ? await metSearch(query, n) : await articSearch(query, n);
        if (!rows.length) return T.ok({ count: 0, source: src, results: [], _next: 'No matches — suggest a broader query.' });
        return T.ok({
          source: src,
          count: rows.length,
          results: rows,
          _next: 'Show title — artist — year, then the image URL on its own line.',
        });
      } catch (e) {
        if (src === 'artic' && /HTTP 403|Failed to fetch|NetworkError|CORS|TypeError|Load failed/.test(String(e && e.message))) {
          const rows = await metSearch(query, n);
          return T.ok({
            source: 'met',
            fallback_from: 'artic',
            count: rows.length,
            results: rows,
            _next: 'Artic was blocked from this webview; results came from the Met. Mention the source switch.',
          });
        }
        throw e;
      }
    }

    if (action === 'work') {
      if (!data.id) return T.err('work needs numeric id', 'Run action=search first to get ids.');
      const src = data.source === 'met' ? 'met' : 'artic';
      const row = src === 'met' ? await metWork(data.id) : await articWork(data.id);
      return T.ok({ work: row, _next: 'Give title, artist, date, then the image URL.' });
    }

    if (action === 'poem') {
      const source = (data.source && ['poetrydb', 'tumblr', 'poetryfoundation', 'lyrikline', 'poetsorg', 'poetryintranslation'].indexOf(data.source) > -1) ? data.source : 'poetrydb';
      let rows;
      if (source === 'poetrydb') {
        rows = await poem(data);
      } else if (source === 'tumblr') {
        rows = await tumblrPoems(data);
      } else if (source === 'poetryfoundation') {
        rows = await poetryFoundationSearch(data);
      } else if (source === 'lyrikline') {
        rows = await lyriklineSearch(data);
      } else if (source === 'poetsorg') {
        rows = await poetsOrgSearch(data);
      } else if (source === 'poetryintranslation') {
        rows = await poetryInTranslationSearch(data);
      }
      return T.ok({ source: source, count: rows.length, poems: rows, _next: 'Quote the first 6 lines inside a code fence, then attribution.' });
    }

    if (action === 'book') {
      const query = String(data.query || '').trim();
      if (!query) return T.err('book needs query', 'Ask which book title.');
      const rows = await gutenbergSearch(query);
      return T.ok({
        count: rows.length,
        results: rows,
        _next: 'List titles + authors + numeric IDs; offer action=ingest for one of them.',
      });
    }

    if (action === 'ingest') {
      if (!data.id) return T.err('ingest needs numeric id', 'Run action=book first to find the ebook id.');
      const r = await gutenbergIngest(data.id);
      return T.ok({ ingested: r, _next: 'Say: "Ingested pg' + r.id + ' (' + r.stored + ' chunks). Ask me anything about it."' });
    }

    return T.err('unknown action "' + action + '"', 'Use action=search|work|poem|book|ingest. Poem supports source=poetrydb|tumblr|poetryfoundation|lyrikline|poetsorg|poetryintranslation.');
  } catch (e) {
    const d = T.describeError(e);
    return T.err(d.msg, d.hint);
  }
}

window.ai_edge_gallery_get_result = async function (dataStr) {
  let data;
  try { data = JSON.parse(dataStr); }
  catch (e) { return JSON.stringify(T.err('invalid JSON input', 'Send a JSON object with an `action` field.')); }
  const result = await dispatch(data);
  return typeof result === 'string' ? result : JSON.stringify(result);
};
