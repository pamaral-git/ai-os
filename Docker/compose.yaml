services:

# Local AI Web UI
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080" # Change 8081 for your local browser/Tailscale forwarding port.
    volumes:
      - ./openweb/data:/app/backend/data # Your populated customized profile and all collections.
    env_file:
      - .env # Stable private signing key
    environment:
      ENABLE_PERSISTENT_CONFIG: "True" # Admin settings continue to persist in the restored profile.
      OPENAI_API_BASE_URLS: http://host.docker.internal:8080/v1 # Native llama-swap on your Mac.
      OPENAI_API_KEYS: 
      ENABLE_OLLAMA_API: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_SEARCH_QUERY_GENERATION: "False"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      ENABLE_MEMORY_SYSTEM_CONTEXT: "False"
      ENABLE_MEMORY_BACKGROUND_REVIEW: "False"
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://host.docker.internal:8090/v1
      AUDIO_TTS_OPENAI_API_KEY: 
      AUDIO_TTS_MODEL: 
      AUDIO_TTS_VOICE: S0
      AUDIO_TTS_OPENAI_PARAMS: '{"response_format":"wav","voice":"S0","seed":42}'
      OFFLINE_MODE: "True" # No automatic model downloads or version checks.
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: "False"
      RAG_RERANKING_MODEL_AUTO_UPDATE: "False"
      WHISPER_MODEL_AUTO_UPDATE: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
      ANONYMIZED_TELEMETRY: "False"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

# Disposable Sandboxed Harnesses with free models
  opencode_web:
    image: ghcr.io/anomalyco/opencode:latest
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "8096"]
    ports:
      - "127.0.0.1:8096:8096"
    env_file:
      - path: .env
        required: false
    environment:
      - OPENCODE_SERVER_PASSWORD=${}
      - TERM=xterm-256color
    volumes:
      - ./opencode/share:/root/.local/share/opencode
      - ./opencode/config:/root/.config/opencode
      - ./Documents/cloudwork:/workspace/cloud
      - /Volumes/X-Drive:/workspace/drive
    working_dir: /workspace

  opencode_cli:
    image: ghcr.io/anomalyco/opencode:latest
    profiles:
      - cli
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      - TERM=xterm-256color
    volumes:
      - ./opencode/share:/root/.local/share/opencode
      - ./opencode/config:/root/.config/opencode
      - ./Documents/cloudwork:/workspace/cloud
      - /Volumes/X-Drive:/workspace/drive
    working_dir: /workspace

  cline:
    image: cline-cli:latest
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
            git \
            ripgrep \
            curl \
            ca-certificates \
            procps \
         && rm -rf /var/lib/apt/lists/* \
         && git config --system --add safe.directory '*'
        RUN npm install -g cline
        WORKDIR /workspace
        ENV TERM=xterm-256color
        ENTRYPOINT ["cline"]
    profiles:
      - cli
    restart: "no"
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      - CLINE_API_KEY=${}
      - TERM=xterm-256color
    volumes:
      - ./cline:/root/.cline
      - ./Documents/cloudwork:/workspace/cloud
      - /Volumes/X-Drive:/workspace/drive
    working_dir: /workspace

# Main AI Tool Services
  searxng-engine:
    container_name: searxng-engine
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BIND_ADDRESS=0.0.0.0:8080
      - BASE_URL=http://localhost:8888/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  searxng-mcp:
    container_name: searxng-mcp
    build:
      context: ./searxng/searxng-mcp
    restart: unless-stopped
    depends_on:
      searxng-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SEARXNG_URL: http://searxng-engine:8080
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      SEARXNG_MAX_RESULTS: 8
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  research:
    image: itzcrazykns1337/vane:latest
    container_name: vane
    restart: no
    ports:
      - "8377:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./vane:/home/vane/data

# Media Tools
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=9999
      - TORRENTING_PORT=9998
    volumes:
      - ./qbit:/config
      - /Volumes/X-Drive/download:/downloads
    ports:
      - 9999:9999
      - 9998:9998
      - 9998:9998/udp
  
  mp3chapter:
    image: nginx:latest
    container_name: mp3chapter
    restart: unless-stopped
    ports:
      - 127.0.0.1:9997:80
    volumes:
      - ./mp3chapters/mp3chapters.github.io-master:/usr/share/nginx/html:ro
      - ./mp3chapters/nginx.conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: libreoffice
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./libreoffice:/config
    ports:
      - 3000:3000
      - 3001:3001
    shm_size: "1gb"
    restart: unless-stopped